{% extends 'detector/base.html' %}{% block content %}<div class="container py-5"><h2>Prediction History</h2><div class="table-card mt-4 table-responsive"><table class="table align-middle"><tr><th>URL</th><th>Result</th><th>Confidence</th><th>Risk</th><th>Date</th></tr>{% for x in items %}<tr><td>{{x.url|truncatechars:70}}</td><td>{{x.prediction}}</td><td>{{x.confidence}}%</td><td>{{x.risk_level}}</td><td>{{x.created_at|date:"d M Y H:i"}}</td></tr>{% empty %}<tr><td colspan="5">No history.</td></tr>{% endfor %}</table></div></div>{% endblock %}
