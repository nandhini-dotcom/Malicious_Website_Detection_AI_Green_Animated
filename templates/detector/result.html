{% extends 'detector/base.html' %}{% block content %}<div class="container py-5"><div class="result-card {% if item.prediction == 'MALICIOUS' %}danger{% else %}safe{% endif %}"><h1>{{ item.prediction }}</h1><p class="url">{{ item.url }}</p><div class="row text-center g-3"><div class="col-md-4"><div class="metric"><b>{{ item.confidence }}%</b><small>Confidence</small></div></div><div class="col-md-4"><div class="metric"><b>{{ item.risk_level }}</b><small>Risk Level</small></div></div><div class="col-md-4"><div class="metric"><b>RF</b><small>ML Model</small></div></div></div><a class="btn btn-success mt-4" href="/detect/">Scan Another URL</a></div></div>{% endblock %}
